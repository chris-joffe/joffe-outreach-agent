name: Joffe SDR Outreach Agent

on:
  schedule:
    # UTC. Daily send 7:00 AM PDT = 14:00 UTC (Mar–Nov); after Nov DST 14:00 UTC
    # becomes 6:00 AM PST, so bump to 15:00 UTC to keep 7:00 AM local. Report is
    # triggered by the daily run itself (no separate report cron).
    - cron: "0 14 * * 1-5"                 # daily send (+ follow-ups) — M–F 7:00 AM PDT
    - cron: "0 16,18,20,22 * * 1-5"        # reply_check     — every 2h 9AM–3PM PDT
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode"
        required: true
        default: "daily"
        type: choice
        options: [setup, daily, reply_check, report, test]
      dry_run:
        description: "Dry run (no sends)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      limit:
        description: "Max sends this run (blank = full daily cap)"
        required: false
        default: ""
        type: string
      bcc:
        description: "BCC address on every send this run (for smoke tests; blank = none)"
        required: false
        default: ""
        type: string
      test_to:
        description: "For mode=test: address to send a single replyable test email to"
        required: false
        default: ""
        type: string

permissions:
  contents: write            # lets the built-in token commit state.json back

concurrency:
  group: joffe-sdr-outreach  # serialize all runs — never let two overlap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}"     >> $GITHUB_OUTPUT
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
            echo "limit=${{ github.event.inputs.limit }}"   >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 14 * * 1-5") echo "mode=daily"       >> $GITHUB_OUTPUT ;;
              *)              echo "mode=reply_check" >> $GITHUB_OUTPUT ;;
            esac
            echo "dry_run=false" >> $GITHUB_OUTPUT
            echo "limit=" >> $GITHUB_OUTPUT
          fi

      - name: Run agent
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_TOKEN:      ${{ secrets.HUBSPOT_TOKEN }}
          JESSICA_APP_PASSWORD: ${{ secrets.JESSICA_APP_PASSWORD }}
          RYAN_APP_PASSWORD:    ${{ secrets.RYAN_APP_PASSWORD }}
          JOFFE_LAUNCH_DATE:  ${{ vars.JOFFE_LAUNCH_DATE }}
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
          OUTREACH_BCC:       ${{ github.event.inputs.bcc }}
          TEST_EMAIL_TO:      ${{ github.event.inputs.test_to }}
        run: |
          ARGS="--mode ${{ steps.mode.outputs.mode }}"
          [ "${{ steps.mode.outputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ steps.mode.outputs.limit }}" ] && ARGS="$ARGS --limit ${{ steps.mode.outputs.limit }}"
          echo "Running: python outreach_agent.py $ARGS"
          python outreach_agent.py $ARGS

      - name: Commit state.json
        if: ${{ always() && steps.mode.outputs.dry_run != 'true' }}
        run: |
          git config user.name  "Joffe SDR"
          git config user.email "jessicad@joffeschoolsafety.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "no state change"
          else
            git commit -m "chore: update state.json [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || echo "push failed (non-fatal) — re-persists next run"
          fi
